name: Security and dependency review

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit --deny warnings

  # Dependency review needs the repository Dependency graph. It is unavailable on this
  # repository, so it is kept as an opt-in manual job. Enable the Dependency graph under
  # Settings -> Code security and change the condition to `github.event_name == 'pull_request'`
  # or dispatch this job manually.
  dependency-review:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql-javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  codeql-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v3
