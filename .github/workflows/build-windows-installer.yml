name: Build Windows installer (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build and verify Windows setup (.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run source, security and release checks
        run: |
          npm run test:source
          npm run test:security:source
          npm run test:release
          npm run test:release-config
          npm run test:storage-trends
          npm run test:first-pc:script

      - name: Type-check and build frontend
        run: npm run build

      - name: Run Rust tests
        run: npm run test:rust

      # The MSI bundler rejects prerelease versions, so the release candidate builds the
      # NSIS setup executable only.
      - name: Build Windows desktop bundles
        run: npm run build:desktop -- --bundles nsis

      - name: Verify and name the NSIS setup executable
        shell: pwsh
        run: |
          $setupDir = "src-tauri/target/release/bundle/nsis"
          $setups = @(Get-ChildItem -Path $setupDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)
          if ($setups.Count -lt 1) {
            throw "No NSIS setup .exe was generated in $setupDir"
          }
          $setup = $setups | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host ("Built installer: {0} ({1:N1} MB)" -f $setup.FullName, ($setup.Length / 1MB))
          if ($setup.Length -lt 1MB) {
            throw "The generated installer is smaller than 1 MB and cannot be valid: $($setup.FullName)"
          }
          $named = Join-Path $setupDir "Arcange-CrossDiag-Setup-x64.exe"
          Copy-Item -LiteralPath $setup.FullName -Destination $named -Force
          $namedItem = Get-Item -LiteralPath $named
          if ($namedItem.Length -le 0) {
            throw "The renamed installer is empty: $named"
          }
          Write-Host ("Installable file: {0} ({1:N1} MB)" -f $namedItem.FullName, ($namedItem.Length / 1MB))

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcange-crossdiag-windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/Arcange-CrossDiag-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
