[package]
name = "arcange-crossdiag"
version = "1.0.0-rc.2"
description = "Open-source Windows and Linux PC diagnostic toolkit"
authors = ["Mukamyi Izere Arcange"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "arcange_crossdiag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.40"
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
